name: Codex self-hosted worker

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codex:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[CODEX]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      # Inline helpers intentionally work even when Codex-Base predates this workflow.
      - name: Prepare Git for Windows PATH
        shell: pwsh
        run: |
          $roots = @(
            "$env:ProgramFiles\Git",
            "${env:ProgramFiles(x86)}\Git",
            "$env:LOCALAPPDATA\Programs\Git",
            "$env:USERPROFILE\scoop\apps\git\current"
          )
          foreach ($command in @('git.exe', 'bash.exe')) {
            foreach ($found in @(Get-Command $command -All -ErrorAction SilentlyContinue)) {
              $dir = Split-Path $found.Source
              $roots += Split-Path $dir
              $roots += Split-Path (Split-Path $dir)
            }
          }
          $gitRoot = $roots | Select-Object -Unique | Where-Object {
            (Test-Path -LiteralPath "$_\bin\bash.exe") -and
            (Test-Path -LiteralPath "$_\usr\bin\timeout.exe")
          } | Select-Object -First 1
          if (-not $gitRoot) {
            throw "Git for Windows with bin\bash.exe and usr\bin\timeout.exe was not found. Install Git for Windows or expose its installation in PATH. Searched: $($roots -join ', ')"
          }
          $paths = @("$gitRoot\bin", "$gitRoot\usr\bin")
          $env:PATH = ($paths -join ';') + ';' + $env:PATH
          & "$gitRoot\bin\bash.exe" --noprofile --norc -c 'command -v bash; timeout --version; timeout 5 bash -c "exit 0"'
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash / GNU timeout execution check failed.' }
          # Runner prepends entries in reverse order for subsequent steps.
          "$gitRoot\usr\bin" >> $env:GITHUB_PATH
          "$gitRoot\bin" >> $env:GITHUB_PATH

      - name: Resolve task metadata
        id: meta
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $base = "main"
          if ($env:ISSUE_BODY -match '(?im)^Codex-Base:\s*([A-Za-z0-9._/-]+)\s*$') {
            $base = $Matches[1]
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          "branch=codex/issue-${{ github.event.issue.number }}" >> $env:GITHUB_OUTPUT

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.base }}
          fetch-depth: 0

      - name: Prepare Codex work branch
        id: work
        shell: pwsh
        env:
          WORK_BRANCH: ${{ steps.meta.outputs.branch }}
          BASE_BRANCH: ${{ steps.meta.outputs.base }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Git {
            & git @args
            if ($LASTEXITCODE -ne 0) { throw "git $($args -join ' ') failed ($LASTEXITCODE)." }
          }
          if ($env:ISSUE_NUMBER -notmatch '^[1-9][0-9]*$' -or
              $env:WORK_BRANCH -cne "codex/issue-$env:ISSUE_NUMBER") {
            throw 'Work branch must match this issue exactly.'
          }
          Invoke-Git check-ref-format "refs/heads/$env:BASE_BRANCH"
          if ($env:BASE_BRANCH -eq $env:WORK_BRANCH) { throw 'Base cannot be the work branch.' }
          $dirty = Invoke-Git status --porcelain
          if ($dirty) { throw 'Refusing to reset a dirty checkout.' }
          # Capture the exact remote head for a later compare-and-swap push.
          $remote = Invoke-Git ls-remote --heads origin "refs/heads/$env:WORK_BRANCH"
          $expected = if ($remote) { ($remote -split '\s+')[0] } else { '' }
          "expected=$expected" >> $env:GITHUB_OUTPUT
          Invoke-Git fetch --no-tags origin "+refs/heads/$($env:BASE_BRANCH):refs/remotes/origin/$($env:BASE_BRANCH)"
          $baseSha = Invoke-Git rev-parse --verify "refs/remotes/origin/$($env:BASE_BRANCH)^{commit}"
          Invoke-Git checkout -B $env:WORK_BRANCH $baseSha

      - name: Set up Node.js
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: pwsh
        run: npm.cmd ci

      - name: Verify Codex login
        shell: pwsh
        run: |
          codex.cmd --version
          codex.cmd login status

      - name: Run Codex
        shell: pwsh
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $promptPath = Join-Path $env:RUNNER_TEMP "codex-issue-$($env:ISSUE_NUMBER).txt"
          @"
          Work on GitHub issue #$($env:ISSUE_NUMBER) in this repository.

          Title:
          $($env:ISSUE_TITLE)

          Issue body:
          $($env:ISSUE_BODY)

          Instructions:
          - Read AGENTS.md and relevant repository documentation before changing behavior.
          - Implement the issue completely on the current work branch.
          - Preserve existing product decisions and user work.
          - Use focused tests while implementing.
          - Do not commit, push, open a pull request, merge, or deploy; the workflow handles Git operations after verification.
          - If the issue requires a genuine product decision that is not specified, do not invent one. Explain the blocker in your final response and avoid speculative product changes.
          "@ | Set-Content -Path $promptPath -Encoding utf8

          Get-Content -Path $promptPath -Raw |
            codex.cmd --ask-for-approval never exec --sandbox workspace-write --cd "$env:GITHUB_WORKSPACE" -

      - name: Detect changes
        id: changes
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Verify repository
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          if (Test-Path package.json) {
            npm.cmd run test:core
            if ($LASTEXITCODE -ne 0) { throw 'test:core failed.' }
            npm.cmd run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'typecheck failed.' }
            npm.cmd test
            if ($LASTEXITCODE -ne 0) { throw 'npm test failed.' }
          }

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          WORK_BRANCH: ${{ steps.meta.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_REMOTE: ${{ steps.work.outputs.expected }}
        run: |
          $current = git branch --show-current
          if ($LASTEXITCODE -ne 0 -or $current -cne $env:WORK_BRANCH -or
              $env:WORK_BRANCH -cne "codex/issue-$env:ISSUE_NUMBER") {
            throw 'Refusing to publish an unexpected branch.'
          }
          git config user.name "codex-self-hosted"
          if ($LASTEXITCODE -ne 0) { throw 'Git identity setup failed.' }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw 'Git identity setup failed.' }
          git add -A
          if ($LASTEXITCODE -ne 0) { throw 'Git staging failed.' }
          git commit -m "feat: implement issue #$($env:ISSUE_NUMBER) with Codex"
          if ($LASTEXITCODE -ne 0) { throw 'Git commit failed.' }
          git push -u "--force-with-lease=refs/heads/$($env:WORK_BRANCH):$env:EXPECTED_REMOTE" origin "HEAD:refs/heads/$env:WORK_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; remote may have changed. No PR was published by this run.' }

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ steps.meta.outputs.base }}
          WORK_BRANCH: ${{ steps.meta.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.WORK_BRANCH}`;
            const findExisting = async () => (await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
            })).data[0];

            let pr = await findExisting();
            for (let attempt = 0; !pr && attempt < 3; attempt++) {
              try {
                const created = await github.rest.pulls.create({
                  owner,
                  repo,
                  head: process.env.WORK_BRANCH,
                  base: process.env.BASE_BRANCH,
                  title: process.env.ISSUE_TITLE.replace(/^\[CODEX\]\s*/i, ''),
                  body: `Automated Codex implementation for #${process.env.ISSUE_NUMBER}.\n\nBase: \`${process.env.BASE_BRANCH}\`\n\nFinal verification ran in the self-hosted workflow.`,
                  draft: true,
                });
                pr = created.data;
              } catch (error) {
                // Creation may have succeeded despite a lost response, or another run won.
                pr = await findExisting();
                if (pr) break;
                if (error.status === 403) {
                  throw new Error('PR creation forbidden. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests; retain pull-requests: write. Pushed branch: ' + head);
                }
                if (attempt === 2 || (error.status && error.status !== 422 && error.status < 500)) throw error;
                await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
              }
            }
            if (pr.base.ref !== process.env.BASE_BRANCH) {
              throw new Error(`Existing PR ${pr.html_url} targets ${pr.base.ref}; expected ${process.env.BASE_BRANCH}. Refusing to retarget it.`);
            }
            if (!pr.draft) {
              await github.graphql('mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { isDraft } } }', { id: pr.node_id });
            }
            core.setOutput('pr_url', pr.html_url);
            await core.summary.addLink('Codex draft PR', pr.html_url).write();

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                body: `Codex implementation PR: ${pr.html_url}`,
              });
            } catch (error) {
              core.warning(`Draft PR delivered at ${pr.html_url}; issue notification failed: ${error.message}`);
            }

      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: 'Codex completed without repository changes. Check the workflow log for its final response or blockers.',
            });
